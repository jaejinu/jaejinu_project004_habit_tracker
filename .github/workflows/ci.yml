name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew --no-daemon compileJava compileTestJava

      - name: Test (unit + Testcontainers Postgres)
        run: ./gradlew --no-daemon test
        env:
          TESTCONTAINERS_REUSE_ENABLE: 'true'

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7

      - name: Build bootJar (+ REST Docs asciidoctor)
        run: ./gradlew --no-daemon bootJar

      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-jar
          path: build/libs/*.jar
          retention-days: 7

      - name: Upload generated API reference (asciidoctor)
        uses: actions/upload-artifact@v4
        with:
          name: api-reference-html
          path: build/docs/asciidoc/
          retention-days: 7

  docker-image:
    name: build Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootBuildImage
        run: ./gradlew --no-daemon bootBuildImage --imageName=habit-tracker:${{ github.sha }} -x test
