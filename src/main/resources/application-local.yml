spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/habit_tracker
    username: habit
    password: habit_pw
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

logging:
  level:
    com.habit: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
